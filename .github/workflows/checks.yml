name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Préparer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Préparer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Tester les calculs et les parcours
        run: node --test tests/*.test.cjs

      - name: Reconstruire le HTML et les fichiers GitHub Pages
        run: python3 publish.py

      - name: Vérifier que les fichiers générés sont à jour
        shell: bash
        run: |
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "Des fichiers générés ne sont pas suivis dans Git :"
            git ls-files --others --exclude-standard
            exit 1
          fi
